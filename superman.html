<!--
ULTIMATE CYBER SKY RUNNER
SAVE AS: index.html
OPEN IN BROWSER
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Cyber Sky Runner</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:black;
}

canvas{
display:block;
}

#hud{
position:absolute;
top:15px;
left:15px;
color:white;
z-index:10;
}

#title{
font-size:40px;
color:#00e1ff;
text-shadow:0 0 20px #00e1ff;
margin-bottom:10px;
}

.info{
font-size:22px;
margin-top:6px;
}

#bossBar{
width:300px;
height:20px;
background:#333;
border-radius:20px;
overflow:hidden;
margin-top:10px;
display:none;
}

#bossHealth{
height:100%;
width:100%;
background:red;
}

#gameOver{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.9);
padding:40px;
border-radius:20px;
text-align:center;
color:white;
display:none;
z-index:100;
}

#gameOver h1{
font-size:60px;
color:red;
margin-bottom:20px;
}

button{
padding:14px 28px;
border:none;
border-radius:10px;
background:#00e1ff;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

</style>
</head>

<body>

<div id="hud">

<div id="title">ULTIMATE CYBER SKY RUNNER</div>

<div class="info" id="score">Score : 0</div>
<div class="info" id="coins">Coins : 0</div>
<div class="info" id="level">Level : 1</div>
<div class="info" id="power">Power : NONE</div>

<div id="bossBar">
<div id="bossHealth"></div>
</div>

<div class="info">
SPACE / CLICK = FLY<br>
SHIFT = DASH<br>
F = LASER
</div>

</div>

<div id="gameOver">

<h1>GAME OVER</h1>

<h2 id="finalText"></h2>

<button onclick="location.reload()">
RESTART
</button>

</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let score = 0;
let coins = 0;
let level = 1;
let speed = 8;
let running = true;

let power = "NONE";

let dash = false;
let laserMode = false;

let best =
localStorage.getItem("ultraBest") || 0;

const player = {

x:180,
y:300,
width:130,
height:80,
velocity:0,
gravity:0.5,
lift:-10,
shield:false,

fly(){

this.velocity = this.lift;

},

draw(){

ctx.save();

ctx.translate(this.x,this.y);

if(dash){

ctx.shadowBlur = 40;
ctx.shadowColor = "#00ffff";

for(let i=0;i<25;i++){

ctx.beginPath();

ctx.fillStyle =
"rgba(0,255,255,0.7)";

ctx.arc(
-20-Math.random()*60,
20+Math.random()*20,
Math.random()*8,
0,
Math.PI*2
);

ctx.fill();
}

}

ctx.fillStyle="#ffb347";

ctx.beginPath();

ctx.moveTo(40,0);
ctx.lineTo(120,20);
ctx.lineTo(100,60);
ctx.lineTo(20,65);

ctx.closePath();

ctx.fill();

ctx.fillStyle="#1f2937";

ctx.fillRect(20,20,70,35);

ctx.fillStyle="#f5d0fe";

ctx.beginPath();

ctx.arc(70,10,18,0,Math.PI*2);

ctx.fill();

if(this.shield){

ctx.beginPath();

ctx.strokeStyle="#00ffff";
ctx.lineWidth=5;

ctx.arc(60,35,65,0,Math.PI*2);

ctx.stroke();
}

ctx.restore();

},

update(){

this.velocity += this.gravity;

this.y += this.velocity;

if(this.y < 0){

this.y = 0;
this.velocity = 0;
}

if(this.y + this.height >
canvas.height){

gameOver();
}

this.draw();
}
};

const stars = [];

for(let i=0;i<50;i++){

stars.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*3,
speed:Math.random()*3+1

});
}

const buildings = [];

for(let i=0;i<25;i++){

buildings.push({

x:i*200,
width:100+Math.random()*100,
height:200+Math.random()*400

});
}

const obstacles = [];
const drones = [];
const powerups = [];
const bullets = [];
const explosions = [];
const flyingCars = [];
const rain = [];

let boss = null;

function createObjects(){

let gap = 250;

let topHeight =
Math.random()*250+60;

obstacles.push({

x:canvas.width,
width:90,
topHeight:topHeight,
bottomY:topHeight+gap,
passed:false

});

if(Math.random()>0.5){

drones.push({

x:canvas.width+300,
y:Math.random()*500+50,
width:70,
height:40

});
}

if(Math.random()>0.6){

powerups.push({

x:canvas.width+400,
y:Math.random()*500+50,
radius:20,
type:[
"SHIELD",
"BOOST",
"MAGNET"
][Math.floor(Math.random()*3)]

});
}

if(Math.random()>0.4){

flyingCars.push({

x:canvas.width+500,
y:Math.random()*400+100,
width:100,
height:40

});
}
}

setInterval(()=>{

if(running){

createObjects();
}

},1500);

function drawBackground(){

let bg =
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

bg.addColorStop(0,"#020617");
bg.addColorStop(1,"#0f172a");

ctx.fillStyle = bg;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.beginPath();

ctx.fillStyle="white";



ctx.arc(
canvas.width-200,
100,
40,
0,
Math.PI*2
);

ctx.fill();
}

function drawStars(){

ctx.fillStyle="white";

stars.forEach(star=>{

star.x -= star.speed;

if(star.x < 0){

star.x = canvas.width;
star.y =
Math.random()*canvas.height;
}

ctx.beginPath();

ctx.arc(
star.x,
star.y,
star.size,
0,
Math.PI*2
);

ctx.fill();
});
}

function drawBuildings(){

buildings.forEach(building=>{

building.x -= speed/2;

if(building.x +
building.width < 0){

building.x = canvas.width;
}

ctx.fillStyle="#111827";

ctx.fillRect(

building.x,
canvas.height-building.height,
building.width,
building.height

);

for(
let y=
canvas.height-building.height+20;

y<canvas.height-20;

y+=25
){

for(
let x=building.x+15;

x<building.x+
building.width-15;

x+=20
){

if(Math.random()>0.5){

ctx.fillStyle="#ffd700";

ctx.fillRect(x,y,8,10);
}
}
}
});
}

function drawRain(){

for(let i=0;i<80;i++){

rain.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
speed:10

});
}

rain.forEach(drop=>{

drop.x -= 4;
drop.y += drop.speed;

if(drop.y > canvas.height){

drop.y = -20;
}

ctx.strokeStyle=
"rgba(173,216,230,0.5)";

ctx.beginPath();

ctx.moveTo(drop.x,drop.y);

ctx.lineTo(
drop.x-4,
drop.y+12
);

ctx.stroke();
});
}

function drawPlayerLaser(){

bullets.forEach((bullet,index)=>{

bullet.x += 20;

ctx.fillStyle="#00ffff";

ctx.fillRect(
bullet.x,
bullet.y,
40,
6
);

drones.forEach((drone,dIndex)=>{

if(

bullet.x < drone.x+drone.width &&
bullet.x+40 > drone.x &&
bullet.y < drone.y+drone.height &&
bullet.y+6 > drone.y

){

explosions.push({

x:drone.x,
y:drone.y,
size:20

});

drones.splice(dIndex,1);
bullets.splice(index,1);

score += 10;
}
});

if(bullet.x > canvas.width){

bullets.splice(index,1);
}
});
}

function drawExplosions(){

explosions.forEach((e,index)=>{

ctx.beginPath();

ctx.fillStyle=
`rgba(255,100,0,${
e.size/40
})`;

ctx.arc(
e.x,
e.y,
e.size,
0,
Math.PI*2
);

ctx.fill();

e.size += 2;

if(e.size > 40){

explosions.splice(index,1);
}
});
}

function drawObstacles(){

obstacles.forEach((obs,index)=>{

obs.x -= speed;

ctx.fillStyle="#ff0044";

ctx.shadowBlur=20;
ctx.shadowColor="#ff0044";

ctx.fillRect(
obs.x,
0,
obs.width,
obs.topHeight
);

ctx.fillRect(
obs.x,
obs.bottomY,
obs.width,
canvas.height-obs.bottomY
);

if(

player.x < obs.x+obs.width &&
player.x+player.width > obs.x &&

(
player.y < obs.topHeight ||

player.y+player.height >
obs.bottomY
)

){

if(player.shield){

player.shield = false;

obstacles.splice(index,1);

}else{

gameOver();
}
}

if(!obs.passed &&
obs.x+obs.width < player.x){

obs.passed = true;

score++;

}

if(obs.x+obs.width < 0){

obstacles.splice(index,1);
}
});
}

function drawDrones(){

drones.forEach((drone,index)=>{

drone.x -= speed+2;

ctx.fillStyle="#ff0033";

ctx.fillRect(
drone.x,
drone.y,
drone.width,
drone.height
);

ctx.fillStyle="white";

ctx.fillRect(
drone.x+50,
drone.y+12,
10,
10
);

if(

player.x < drone.x+drone.width &&
player.x+player.width > drone.x &&
player.y < drone.y+drone.height &&
player.y+player.height > drone.y

){

if(player.shield){

player.shield = false;

drones.splice(index,1);

}else{

gameOver();
}
}

if(drone.x < -100){

drones.splice(index,1);
}
});
}

function drawFlyingCars(){

flyingCars.forEach((car,index)=>{

car.x -= speed+1;

ctx.fillStyle="#00ffff";

ctx.fillRect(
car.x,
car.y,
car.width,
car.height
);

ctx.fillStyle="#ffffff";

ctx.fillRect(
car.x+20,
car.y+10,
20,
10
);

if(car.x < -150){

flyingCars.splice(index,1);
}
});
}

function drawPowerups(){

powerups.forEach((p,index)=>{

p.x -= speed;

if(p.type==="SHIELD"){

ctx.fillStyle="#00ffff";

}else if(p.type==="BOOST"){

ctx.fillStyle="#ff8800";

}else{

ctx.fillStyle="#00ff66";
}

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.radius,
0,
Math.PI*2
);

ctx.fill();

let dx =
player.x+player.width/2 - p.x;

let dy =
player.y+player.height/2 - p.y;

let distance =
Math.sqrt(dx*dx + dy*dy);

if(distance < 70){

activatePower(p.type);

powerups.splice(index,1);
}
});
}

function activatePower(type){

power = type;

document.getElementById("power")
.innerHTML =
"Power : " + type;

if(type==="SHIELD"){

player.shield = true;
}

if(type==="BOOST"){

speed = 15;

setTimeout(()=>{

speed = 8 + level;

},5000);
}
}

function spawnBoss(){

boss = {

x:canvas.width-200,
y:150,
width:250,
height:250,
health:100

};

document.getElementById(
"bossBar"
).style.display = "block";
}

function drawBoss(){

if(!boss) return;

ctx.fillStyle="#990000";

ctx.fillRect(
boss.x,
boss.y,
boss.width,
boss.height
);

ctx.fillStyle="white";

ctx.fillRect(
boss.x+60,
boss.y+70,
20,
20
);

bullets.forEach((bullet,index)=>{

if(

bullet.x < boss.x+boss.width &&
bullet.x+40 > boss.x &&
bullet.y < boss.y+boss.height &&
bullet.y+6 > boss.y

){

boss.health -= 2;

bullets.splice(index,1);

document.getElementById(
"bossHealth"
).style.width =
boss.health + "%";

if(boss.health <= 0){

score += 200;

boss = null;

document.getElementById(
"bossBar"
).style.display = "none";
}
}
});
}

function updateUI(){

level =
Math.floor(score/50)+1;

document.getElementById("score")
.innerHTML =
"Score : " + score;

document.getElementById("coins")
.innerHTML =
"Coins : " + coins;

document.getElementById("level")
.innerHTML =
"Level : " + level;

if(score > best){

best = score;

localStorage.setItem(
"ultraBest",
best
);
}
}

function gameOver(){

running = false;

document.getElementById(
"gameOver"
).style.display = "block";

document.getElementById(
"finalText"
).innerHTML =

"Score : " + score;
}

function animate(){

if(!running) return;

requestAnimationFrame(animate);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawBackground();

drawStars();

drawBuildings();

drawRain();

drawFlyingCars();

drawObstacles();

drawDrones();

drawPowerups();

drawPlayerLaser();

drawExplosions();

drawBoss();

player.update();

updateUI();

if(score > 150 && !boss){

spawnBoss();
}
}

window.addEventListener(
"keydown",
e=>{

if(e.code==="Space"){

player.fly();
}

if(e.key==="F" ||
e.key==="f"){

bullets.push({

x:player.x+120,
y:player.y+40

});
}

if(e.key==="Shift"){

dash = true;

speed = 18;

setTimeout(()=>{

dash = false;

speed = 8 + level;

},2000);
}
});

window.addEventListener(
"click",
()=>{

player.fly();
});

animate();

</script>

</body>
</html>
